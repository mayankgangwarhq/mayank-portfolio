<svg width="600" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0a2a1b"/>
      <stop offset="100%" stop-color="#040c07"/>
    </radialGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" rx="30" fill="url(#grad)"/>
  <rect width="580" height="580" x="10" y="10" rx="25" fill="none" stroke="#10b981" stroke-width="2" stroke-opacity="0.3"/>
  
  <!-- Ambient circle -->
  <circle cx="300" cy="300" r="160" fill="#10b981" fill-opacity="0.1"/>
  
  <!-- Silhouette frame -->
  <circle cx="300" cy="240" r="80" fill="#0d3021" stroke="#34d399" stroke-width="3" stroke-opacity="0.4"/>
  <path d="M180 440 C180 350, 420 350, 420 440 Z" fill="#0d3021" stroke="#34d399" stroke-width="3" stroke-opacity="0.4"/>
  
  <!-- MG Monogram -->
  <text x="300" y="260" font-family="'Plus Jakarta Sans', monospace, sans-serif" font-size="64" font-weight="900" fill="url(#glow)" text-anchor="middle" letter-spacing="-2">MG</text>
  
  <!-- Label -->
  <text x="300" y="490" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">Mayank Gangwar</text>
  <text x="300" y="520" font-family="'JetBrains Mono', monospace" font-size="14" fill="#34d399" text-anchor="middle">Founder &amp; AI Builder</text>
</svg>
